# Build the site with Zensical and publish it to GitHub Pages.
#
# This is the org Pages site, served at https://bristolflightlab.github.io/.
# One-off setting: Settings > Pages > Build and deployment > Source must be
# "GitHub Actions" (it was previously the gh-pages branch, built by MkDocs).
name: ci

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          # The Flight Lab theme is a submodule; without it the build fails on
          # a missing stylesheet rather than publishing an unbranded site.
          submodules: true

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - run: pip install -r requirements.txt
      - run: zensical build --clean

      - if: github.ref == 'refs/heads/main'
        uses: actions/upload-pages-artifact@v3
        with:
          path: site

  deploy:
    if: github.ref == 'refs/heads/main'
    needs: build
    runs-on: ubuntu-latest
    permissions:
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/deploy-pages@v4
        id: deployment
